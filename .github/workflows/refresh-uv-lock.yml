name: Refresh uv lockfile

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/refresh-uv-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Regenerate lockfile
        run: uv lock

      - name: Commit updated lockfile if changed
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "Regenerate uv.lock for StudyNova dependencies"
            git push
          else
            echo "uv.lock is already up to date."
          fi
